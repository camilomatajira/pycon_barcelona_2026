[package]
name = "sysadmindb_rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "sysadmindb_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.28.3"
regex = "1.12.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "log_benchmark"
harness = false


